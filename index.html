<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Babuu ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --cream:#fff8ed;
    --paper:#fffdf7;
    --maroon:#762f3c;
    --brown:#704b43;
    --rose:#c96d7c;
}

html,body{
    width:100%;
    height:100%;
}

body{
    background:#f3d5c5;
    color:var(--brown);
    font-family:'DM Sans',sans-serif;
    overflow:hidden;
}

/* =========================
   PAGE SYSTEM
========================= */

.page{
    position:fixed;
    inset:0;
    width:100%;
    height:100vh;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px 15px;
    overflow-y:auto;
    z-index:1;
}

.page.active{
    display:flex;
    z-index:10;
    animation:pageIn .5s ease;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:scale(.97);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.container{
    width:100%;
    max-width:850px;
    margin:auto;
}

/* =========================
   BUTTON
========================= */

.btn{
    border:0;
    padding:14px 28px;
    border-radius:50px;
    background:var(--maroon);
    color:white;
    font-size:15px;
    cursor:pointer;
    box-shadow:0 5px 0 #54222c;
}

.btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #54222c;
}

.btn.light{
    background:#fff3e7;
    color:var(--maroon);
    box-shadow:0 5px 0 #dfb9a7;
}

/* =========================
   COVER
========================= */

#cover{
    background:
    radial-gradient(circle at 15% 20%,#ffe8d7 0 12%,transparent 32%),
    radial-gradient(circle at 90% 80%,#f5bbc4 0 12%,transparent 32%),
    var(--cream);
}

.cover-card{
    max-width:650px;
    margin:auto;
    background:var(--paper);
    padding:45px 20px 40px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 25px 60px #713c4720;
    transform:rotate(-1deg);
}

.label{
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#a67870;
}

.cover-title{
    font-family:'Caveat',cursive;
    font-size:clamp(60px,14vw,100px);
    color:var(--maroon);
    line-height:.85;
    margin:18px 0;
}

.cover-sub{
    font-family:'Caveat',cursive;
    color:#a35d68;
    font-size:25px;
    line-height:1.2;
}

/* =========================
   ENVELOPE
========================= */

.envelope-wrap{
    width:285px;
    height:190px;
    margin:38px auto 28px;
    cursor:pointer;
    perspective:900px;
}

.envelope{
    width:100%;
    height:100%;
    position:relative;
    background:#e9b09b;
    border-radius:5px;
    box-shadow:0 15px 30px #713c4725;
}

.envelope-back{
    position:absolute;
    inset:0;
    background:#e0a08d;
    z-index:1;
}

.letter-preview{
    position:absolute;
    width:88%;
    height:145px;
    left:6%;
    bottom:15px;
    background:#fffdf7;
    z-index:2;
    padding:20px;
    font-family:'Caveat',cursive;
    font-size:21px;
    color:var(--maroon);
    transition:1s;
}

.flap{
    position:absolute;
    inset:0;
    z-index:4;
    background:#f4c5b4;
    clip-path:polygon(0 0,50% 58%,100% 0);
    transform-origin:top;
    transition:1s;
}

.envelope.open .flap{
    transform:rotateX(180deg);
}

.envelope.open .letter-preview{
    transform:translateY(-105px);
}

.envelope-front{
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;
    background:#d99683;
    clip-path:polygon(0 100%,50% 45%,100% 100%);
}

.seal{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#9e4c5d;
    color:white;
    position:absolute;
    z-index:6;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    transition:.5s;
}

.envelope.open .seal{
    opacity:0;
    transform:translate(-50%,-50%) scale(.3);
}

/* =========================
   LETTER
========================= */

#letter{
    background:#f7dccb;
}

.paper{
    max-width:720px;
    margin:auto;
    padding:35px 28px;
    background:var(--paper);
    box-shadow:0 20px 45px #713c4720;
}

.paper h2{
    font-family:'Caveat',cursive;
    font-size:50px;
    color:var(--maroon);
    margin-bottom:18px;
}

.paper p{
    font-family:'Caveat',cursive;
    font-size:22px;
    line-height:1.5;
    margin-bottom:12px;
}

.signature{
    text-align:right;
    color:var(--rose);
    font-size:29px!important;
}

/* =========================
   BALLOONS
========================= */

#balloons{
    background:#fff0e3;
}

.section-title{
    font-family:'Caveat',cursive;
    font-size:clamp(48px,10vw,78px);
    line-height:.95;
    text-align:center;
    color:var(--maroon);
    margin-bottom:12px;
}

.subtitle{
    max-width:560px;
    margin:auto;
    text-align:center;
    color:#916d64;
    font-size:15px;
    line-height:1.7;
}

.balloon-area{
    max-width:700px;
    margin:45px auto 30px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:24px;
}

.balloon{
    width:70px;
    height:95px;
    border-radius:50%;
    position:relative;
    cursor:pointer;
    animation:float 3s ease-in-out infinite;
}

.balloon:nth-child(5){background:#d88795;animation-delay:1.2s}
.balloon:nth-child(6){background:#efc7a9;animation-delay:1.5s}

    inset:0;

    align-items:center;
    justify-content:center;
    color:white;
